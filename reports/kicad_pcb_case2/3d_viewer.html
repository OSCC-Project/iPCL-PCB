<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>KiCad PCB 3D Viewer - STM32F407 机器人主控板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
#info { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
#info h2 { font-size: 16px; margin-bottom: 6px; color: #4fc3f7; }
#info .stat { color: #aaa; }
#controls { position: absolute; bottom: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px; font-size: 12px; color: #888; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #4fc3f7; }
canvas { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<div id="info">
  <h2>STM32F407 机器人主控板 3D</h2>
  <div>MCU: STM32F407VET6 | 4-Layer Board</div>
  <div class="stat">Components: 177 | Nets: 168 | Vias: 790</div>
  <div class="stat">Tracks: 1268 | Layers: F.Cu/In1/In2/B.Cu</div>
</div>
<div id="controls">Mouse: Rotate | Scroll: Zoom | Right-click: Pan | R: Reset</div>
<div id="loading">Loading 3D model (28MB)...</div>
<canvas id="canvas"></canvas>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x1a1a2e);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 10000);
camera.position.set(0, 80, 120);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const d1 = new THREE.DirectionalLight(0xffffff, 0.8);
d1.position.set(50, 100, 50);
scene.add(d1);
const d2 = new THREE.DirectionalLight(0x88ccff, 0.3);
d2.position.set(-50, 50, -50);
scene.add(d2);
const grid = new THREE.GridHelper(200, 40, 0x333366, 0x222244);
grid.position.y = -1;
scene.add(grid);
new GLTFLoader().load('pcb_3d_model.glb', (gltf) => {
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  model.position.sub(center);
  const maxDim = Math.max(size.x, size.y, size.z);
  camera.position.set(0, maxDim*0.8, maxDim*1.2);
  controls.target.set(0,0,0);
  controls.update();
  scene.add(model);
  document.getElementById('loading').style.display='none';
}, (p) => { if(p.total){document.getElementById('loading').textContent=`Loading... ${Math.round(p.loaded/p.total*100)}%`;}});
document.addEventListener('keydown',(e)=>{if(e.key==='r'||e.key==='R'){camera.position.set(0,80,120);controls.target.set(0,0,0);controls.update();}});
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);})();
</script>
</body>
</html>
